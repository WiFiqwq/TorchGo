name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/android/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: node --check www/app.js
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        run: chmod +x ./android/gradlew && ./android/gradlew -p ./android assembleDebug --no-daemon

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Python syntax
        run: python -m compileall -q apps/desktop tools
